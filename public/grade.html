<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>반배치 분석실 | 중등관</title>
<link rel="icon" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B2A6F;--gold:#F28C28;--goldt:#B4560A;--ink:#1E2540;--sub:#555B6E;--line:#E2E4EB;--soft:#F2F3F7;--bg:#F5F6FA;--red:#C2364F;--green:#2E7D5B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Gowun Dodum',sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.j{font-family:'Jua',sans-serif;font-weight:400}
header{background:var(--navy);color:#fff;padding:14px 0}
.wrap{max-width:1240px;margin:0 auto;padding:0 14px}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header small{color:var(--gold);font-size:12px;letter-spacing:.15em;display:block}
header h1{font-size:20px}
.tabs{display:flex;gap:6px}
.tabs button{border:0;border-radius:999px;padding:8px 16px;font-family:'Jua',sans-serif;font-size:15px;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;min-height:40px}
.tabs button.on{background:var(--gold);color:var(--navy)}
.btn{border:0;border-radius:999px;padding:8px 16px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;min-height:40px;white-space:nowrap}
.n{background:var(--navy);color:#fff}.g{background:var(--gold);color:var(--navy)}.w{background:#fff;color:var(--navy);border:1.5px solid var(--line)}.r{background:#fde8ec;color:var(--red)}
.login{max-width:360px;margin:80px auto;background:#fff;border-radius:18px;padding:28px;border:1px solid var(--line)}
.login input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;margin:8px 0;font-family:inherit}
.err{color:var(--red);font-size:14px;min-height:20px}
.grid{display:grid;grid-template-columns:320px 1fr;gap:14px;margin:16px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.card h2{color:var(--navy);font-size:19px;margin-bottom:10px}
.list{max-height:70vh;overflow:auto}
.list button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:10px 8px;font-family:inherit;font-size:14.5px;cursor:pointer;min-height:44px}
.list button.on{background:var(--soft)}
.list .slotH{font-family:'Jua',sans-serif;color:var(--goldt);font-size:14px;padding:10px 8px 4px}
.tag{font-size:12px;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--sub);white-space:nowrap}
.tag.done{background:var(--navy);color:#fff}.tag.abs{background:#fde8ec;color:var(--red)}
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px;margin:10px 0}
.qs button{min-height:56px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-family:'Jua',sans-serif;font-size:18px;color:var(--navy);position:relative}
.qs button small{display:block;font-family:'Gowun Dodum';font-size:10px;color:var(--sub);line-height:1.1}
.qs button.x{background:var(--red);border-color:var(--red);color:#fff}.qs button.x small{color:#fff}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.sum div{background:var(--soft);border-radius:12px;padding:10px 14px}
.sum small{display:block;color:var(--sub);font-size:12px}.sum b{font-size:22px;color:var(--navy)}
.ub{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:5px 0}
.ub span{width:150px;flex-shrink:0}.ub i{flex:1;height:12px;background:var(--soft);border-radius:6px;overflow:hidden;position:relative}
.ub i em{position:absolute;left:0;top:0;bottom:0;background:var(--navy);border-radius:6px}
.ub b{width:46px;text-align:right}
label.t{display:block;font-size:14px;color:var(--navy);font-weight:700;margin:12px 0 5px}
textarea,select,input[type=text],input[type=number]{font-family:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
textarea{min-height:80px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--soft);color:var(--sub);text-align:left;padding:8px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:7px 8px}
.cfg td input{padding:6px 8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;display:none;z-index:30}
.empty{color:var(--sub);text-align:center;padding:30px}
@media(max-width:820px){.grid{grid-template-columns:1fr}.list{max-height:none}}
</style>
</head>
<body>
<header><div class="wrap"><div><small>SEOKANG MATH · 중등관 · 반배치 분석실</small><h1 class="j" id="ttl">반배치 분석실</h1></div>
  <div class="tabs" id="tabs" style="display:none"><button data-t="grade" class="on">채점 입력</button><button data-t="stat">통계</button><button data-t="cfg">시험 설정</button><a class="btn w" href="/admin.html" style="text-decoration:none;display:inline-flex;align-items:center">신청 관리</a></div></div></header>

<div class="login" id="login"><h2 class="j" style="color:var(--navy)">관리자 로그인</h2>
  <label for="pw" style="font-size:14px;color:var(--sub)">관리자 비밀번호</label><input type="password" id="pw">
  <div class="err" id="lerr" role="alert"></div><button class="btn n" style="width:100%" id="go">확인</button></div>

<main class="wrap" id="main" style="display:none">
  <!-- 채점 -->
  <section id="v-grade" class="grid">
    <div class="card"><h2 class="j">응시 학생</h2><div class="list" id="list"></div></div>
    <div class="card" id="panel"><div class="empty">왼쪽에서 학생을 고르세요.<br>틀린 문항만 눌러서 표시하면 점수가 자동으로 계산됩니다.</div></div>
  </section>
  <!-- 통계 -->
  <section id="v-stat" style="display:none;margin:16px 0">
    <div class="card" style="margin-bottom:14px"><div class="row" style="margin:0;justify-content:space-between"><h2 class="j" style="margin:0">전체 통계</h2><button class="btn w" id="csv">엑셀(CSV) 받기 · 연락처 제외</button></div><div class="sum" id="sSum"></div></div>
    <div class="grid" style="grid-template-columns:1fr 1fr;margin:0">
      <div class="card"><h2 class="j">단원별 평균 정답률</h2><div id="sUnit"></div></div>
      <div class="card"><h2 class="j">점수 분포 · 추천 과정</h2><div id="sDist"></div></div>
    </div>
    <div class="card" style="margin-top:14px"><h2 class="j">문항별 정답률</h2><div id="sQ" style="overflow:auto"></div></div>
  </section>
  <!-- 설정 -->
  <section id="v-cfg" style="display:none;margin:16px 0">
    <div class="card">
      <h2 class="j">시험 설정</h2>
      <p style="font-size:13.5px;color:var(--sub)">실제 시험지에 맞게 문항별 단원과 배점을 입력하세요. 채점한 결과는 설정을 바꾸면 자동으로 다시 계산됩니다.</p>
      <label class="t" for="cTitle">시험 이름</label><input type="text" id="cTitle">
      <div class="row">
        <label style="font-size:14px">단원 강점 기준 <input type="number" id="cStrong" style="width:80px">% 이상</label>
        <label style="font-size:14px">보완 기준 <input type="number" id="cWeak" style="width:80px">% 미만</label>
        <label style="font-size:14px">선풀 추천 <input type="number" id="cSun" style="width:80px">% 이상</label>
        <label style="font-size:14px">힌풀 추천 <input type="number" id="cHin" style="width:80px">% 이상</label>
      </div>
      <div style="overflow:auto;margin-top:12px"><table class="cfg"><thead><tr><th style="width:60px">번호</th><th>단원</th><th style="width:110px">배점</th><th style="width:60px"></th></tr></thead><tbody id="cRows"></tbody></table></div>
      <div class="row"><button class="btn w" id="cAdd">+ 문항 추가</button><span id="cTotal" style="font-size:14px;color:var(--sub)"></span><span style="flex:1"></span><button class="btn n" id="cSave">설정 저장</button></div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
let PW='',TEST=null,ROWS=[],CUR=null,WRONG=new Set();
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1800);};
async function api(body){const r=await fetch('/api/grade',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:PW,...body})});const j=await r.json();if(!j.ok)throw new Error(j.message||'오류');TEST=j.test;ROWS=j.rows;return j;}
// 화면에서도 같은 계산 (즉시 미리보기)
function analyze(wrong){const W=new Set(wrong);let total=0,got=0;const U={};
  TEST.questions.forEach(q=>{const u=U[q.unit]||(U[q.unit]={unit:q.unit,total:0,got:0});u.total+=+q.pts;total+=+q.pts;if(!W.has(q.no)){u.got+=+q.pts;got+=+q.pts;}});
  const units=Object.values(U).map(u=>({...u,rate:u.total?Math.round(u.got/u.total*100):0}));const rate=total?Math.round(got/total*100):0;
  return {total,got,rate,units,course:rate>=((TEST.cut.sunpul==null?85:TEST.cut.sunpul))?'선풀 (상 · HC · AA)':rate>=TEST.cut.hinpul?'힌풀 (중 · AB · BA)':'함풀 (하 · BB · CC)'};}
function drawList(){
  let html='',slot=null;
  ROWS.forEach(r=>{if(r.slot!==slot){slot=r.slot;html+=`<div class="slotH">${esc(slot||'회차 없음')} 회차</div>`;}
    const s=r.score;const tag=!s?'<span class="tag">미채점</span>':s.absent?'<span class="tag abs">결석</span>':`<span class="tag done">${s.result.got}점</span>`;
    html+=`<button data-id="${r.id}" class="${CUR&&CUR.id===r.id?'on':''}"><span><b>${esc(r.studentName)}</b> <small style="color:var(--sub)">${esc(r.school)}</small></span>${tag}</button>`;});
  $('#list').innerHTML=html||'<div class="empty">추가 반배치 신청자가 없습니다.</div>';
  document.querySelectorAll('#list button').forEach(b=>b.onclick=()=>open(ROWS.find(r=>r.id===b.dataset.id)));
}
function open(r){CUR=r;WRONG=new Set(r.score?.wrong||[]);drawList();drawPanel();}
function drawPanel(){
  const r=CUR,s=r.score||{},a=analyze([...WRONG]);
  const link=s.token?`${location.origin}/r.html?t=${s.token}`:'';
  $('#panel').innerHTML=`<div class="row" style="margin:0;justify-content:space-between"><h2 class="j" style="margin:0">${esc(r.studentName)} <small style="font-family:'Gowun Dodum';font-size:14px;color:var(--sub)">${esc(r.school)} · ${esc(r.slot)} 회차</small></h2>
    <label style="font-size:14px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="abs" ${s.absent?'checked':''} style="width:18px;height:18px"> 결석</label></div>
    <p style="font-size:13px;color:var(--sub);margin-top:6px">틀린 문항을 누르세요 (다시 누르면 취소)</p>
    <div class="qs" id="qs">${TEST.questions.map(q=>`<button data-n="${q.no}" class="${WRONG.has(q.no)?'x':''}" aria-pressed="${WRONG.has(q.no)}">${q.no}<small>${q.pts}점</small></button>`).join('')}</div>
    <div class="sum"><div><small>점수</small><b class="j">${a.got} / ${a.total}</b></div><div><small>정답률</small><b class="j">${a.rate}%</b></div><div><small>틀린 문항</small><b class="j">${WRONG.size}개</b></div><div><small>추천 과정</small><b class="j" style="font-size:17px">${a.course}</b></div></div>
    ${a.units.map(u=>`<div class="ub"><span>${esc(u.unit)}</span><i><em style="width:${u.rate}%;background:${u.rate<TEST.cut.weak?'var(--red)':u.rate>=TEST.cut.strong?'var(--green)':'var(--navy)'}"></em></i><b>${u.rate}%</b></div>`).join('')}
    <label class="t" for="course">추천 과정 (바꿀 수 있어요)</label>
    <select id="course"><option value="">자동 (${a.course})</option>${['선풀 (상 · HC · AA)','힌풀 (중 · AB · BA)','함풀 (하 · BB · CC)'].map(c=>`<option ${s.course===c?'selected':''}>${c}</option>`).join('')}</select>
    <label class="t" for="cmt">선생님 코멘트 (리포트에 그대로 들어갑니다)</label>
    <textarea id="cmt" placeholder="예: 계산은 정확한데 문장제에서 식 세우기를 어려워합니다. 1-1 완성반에서 ...">${esc(s.comment)}</textarea>
    <div class="row"><button class="btn n" id="save">저장</button>
      ${link?`<a class="btn w" href="${link}" target="_blank" rel="noopener" style="text-decoration:none">리포트 보기</a><button class="btn w" id="copy">링크 복사</button><button class="btn g" id="sms">학부모에게 보내기</button>`:'<span style="font-size:13px;color:var(--sub)">저장하면 학부모용 리포트 링크가 만들어집니다.</span>'}</div>`;
  document.querySelectorAll('#qs button').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;WRONG.has(n)?WRONG.delete(n):WRONG.add(n);drawPanel();});
  $('#save').onclick=async()=>{try{await api({action:'save',id:r.id,wrong:[...WRONG],absent:$('#abs').checked,course:$('#course').value,comment:$('#cmt').value});CUR=ROWS.find(x=>x.id===r.id);drawList();drawPanel();toast('저장했습니다');}catch(e){toast(e.message);}};
  if(link){$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(link);toast('링크를 복사했습니다');}catch(e){prompt('링크',link);}};
    $('#sms').onclick=()=>{const t=`[서강수학원 중등관] ${r.studentName} 학부모님, 반배치고사 결과 분석 리포트를 보내드립니다.\n${link}\n결과 상담 일정은 따로 연락드리겠습니다. 문의 02.406.3900`;
      const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);location.href=`sms:${String(r.parentPhone).replace(/-/g,'')}${ios?'&':'?'}body=${encodeURIComponent(t)}`;};}
}
function drawStat(){
  const done=ROWS.filter(r=>r.score&&!r.score.absent);const res=done.map(r=>r.score.result);
  const avg=res.length?Math.round(res.reduce((s,x)=>s+x.rate,0)/res.length):0;
  const cnt=k=>done.filter(r=>(r.score.course||r.score.result.course).startsWith(k)).length;
  $('#sSum').innerHTML=`<div><small>신청</small><b class="j">${ROWS.length}명</b></div><div><small>채점 완료</small><b class="j">${done.length}명</b></div><div><small>결석</small><b class="j">${ROWS.filter(r=>r.score?.absent).length}명</b></div><div><small>평균 정답률</small><b class="j">${avg}%</b></div><div><small>선풀 추천</small><b class="j">${cnt('선풀')}명</b></div><div><small>힌풀 추천</small><b class="j">${cnt('힌풀')}명</b></div><div><small>함풀 추천</small><b class="j">${cnt('함풀')}명</b></div>`;
  const U={};TEST.questions.forEach(q=>{U[q.unit]=U[q.unit]||{t:0,g:0};});
  done.forEach(r=>TEST.questions.forEach(q=>{U[q.unit].t+=+q.pts;if(!r.score.wrong.includes(q.no))U[q.unit].g+=+q.pts;}));
  $('#sUnit').innerHTML=Object.entries(U).map(([u,v])=>{const p=v.t?Math.round(v.g/v.t*100):0;return `<div class="ub"><span>${esc(u)}</span><i><em style="width:${p}%"></em></i><b>${p}%</b></div>`;}).join('')||'<div class="empty">채점된 학생이 없습니다.</div>';
  const bins=[[90,101],[80,90],[70,80],[60,70],[0,60]];const mx=Math.max(1,...bins.map(([a,b])=>res.filter(x=>x.rate>=a&&x.rate<b).length));
  $('#sDist').innerHTML=bins.map(([a,b])=>{const c=res.filter(x=>x.rate>=a&&x.rate<b).length;return `<div class="ub"><span>${b>100?'90% 이상':a===0?'60% 미만':a+'%대'}</span><i><em style="width:${c/mx*100}%;background:var(--gold)"></em></i><b>${c}명</b></div>`;}).join('')+`<p style="font-size:13px;color:var(--sub);margin-top:8px">추천 기준: 선풀 ${(TEST.cut.sunpul==null?85:TEST.cut.sunpul)}% 이상 · 힌풀 ${TEST.cut.hinpul}% 이상 · 그 아래 함풀</p>`;
  $('#sQ').innerHTML=`<table><thead><tr><th>번호</th>${TEST.questions.map(q=>`<th>${q.no}</th>`).join('')}</tr></thead><tbody><tr><td>단원</td>${TEST.questions.map(q=>`<td style="font-size:11px;color:var(--sub)">${esc(q.unit)}</td>`).join('')}</tr><tr><td>정답률</td>${TEST.questions.map(q=>{const p=done.length?Math.round(done.filter(r=>!r.score.wrong.includes(q.no)).length/done.length*100):0;return `<td style="font-weight:700;color:${p<50?'var(--red)':'var(--navy)'}">${done.length?p+'%':'-'}</td>`;}).join('')}</tr></tbody></table>`;
}
function drawCfg(){
  $('#cTitle').value=TEST.title;$('#cStrong').value=TEST.cut.strong;$('#cWeak').value=TEST.cut.weak;$('#cHin').value=TEST.cut.hinpul;$('#cSun').value=(TEST.cut.sunpul==null?85:TEST.cut.sunpul);
  const draw=qs=>{$('#cRows').innerHTML=qs.map((q,i)=>`<tr><td>${i+1}</td><td><input type="text" value="${esc(q.unit)}" data-i="${i}" data-k="unit" aria-label="${i+1}번 단원"></td><td><input type="number" value="${q.pts}" data-i="${i}" data-k="pts" min="0" aria-label="${i+1}번 배점"></td><td><button class="btn r" style="min-height:32px;padding:4px 10px" data-del="${i}">삭제</button></td></tr>`).join('');
    $('#cTotal').textContent=`총 ${qs.length}문항 · ${qs.reduce((s,q)=>s+(+q.pts||0),0)}점`;
    document.querySelectorAll('#cRows input').forEach(el=>el.oninput=()=>{qs[el.dataset.i][el.dataset.k]=el.dataset.k==='pts'?+el.value:el.value;$('#cTotal').textContent=`총 ${qs.length}문항 · ${qs.reduce((s,q)=>s+(+q.pts||0),0)}점`;});
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{qs.splice(+b.dataset.del,1);draw(qs);});};
  const qs=TEST.questions.map(q=>({...q}));draw(qs);
  $('#cAdd').onclick=()=>{qs.push({unit:qs.length?qs[qs.length-1].unit:'',pts:qs.length?qs[qs.length-1].pts:4});draw(qs);};
  $('#cSave').onclick=async()=>{if(!confirm('시험 설정을 저장할까요? 채점 결과는 새 설정으로 다시 계산됩니다.'))return;
    try{await api({action:'saveConfig',test:{title:$('#cTitle').value,questions:qs,cut:{strong:+$('#cStrong').value,weak:+$('#cWeak').value,sunpul:+$('#cSun').value,hinpul:+$('#cHin').value}}});toast('설정을 저장했습니다');drawAll();}catch(e){toast(e.message);}};
}
function drawAll(){$('#ttl').textContent=TEST.title+' 분석실';drawList();if(CUR){CUR=ROWS.find(r=>r.id===CUR.id);CUR?drawPanel():null;}drawStat();drawCfg();}
document.querySelectorAll('#tabs [data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs [data-t]').forEach(x=>x.classList.toggle('on',x===b));['grade','stat','cfg'].forEach(t=>$('#v-'+t).style.display=t===b.dataset.t?(t==='grade'?'grid':'block'):'none');if(b.dataset.t==='stat')drawStat();});
$('#csv').onclick=()=>{const q=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const head=['학생','학교','회차','점수','만점','정답률','추천 과정',...TEST.questions.map(x=>x.no+'번'),'결석'];
  const lines=ROWS.map(r=>{const s=r.score,a=s&&!s.absent?s.result:null;return [r.studentName,r.school,r.slot,a?a.got:'',a?a.total:'',a?a.rate+'%':'',a?(s.course||a.course):'',...TEST.questions.map(x=>a?(s.wrong.includes(x.no)?'X':'O'):''),s?.absent?'결석':''].map(q).join(',');});
  const u=URL.createObjectURL(new Blob(['﻿'+[head.map(q).join(','),...lines].join('\n')],{type:'text/csv'}));const l=document.createElement('a');l.href=u;l.download=`중등관_반배치_결과_${new Date().toISOString().slice(0,10)}.csv`;l.click();};
async function login(){PW=$('#pw').value;$('#lerr').textContent='';try{await api({action:'list'});$('#login').style.display='none';$('#main').style.display='block';$('#tabs').style.display='flex';drawAll();}catch(e){$('#lerr').textContent=e.message;}}
$('#go').onclick=login;$('#pw').onkeydown=e=>{if(e.key==='Enter')login();};
</script>
</body>
