<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>중등관 QR 코드 받기</title>
<link rel="icon" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
:root{--navy:#0B2A6F;--gold:#F28C28;--goldt:#B4560A;--sub:#555B6E;--line:#E2E4EB;--soft:#F2F3F7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Gowun Dodum',sans-serif;background:var(--navy);color:#1E2540;line-height:1.6}
.j{font-family:'Jua',sans-serif;font-weight:400}
.wrap{max-width:760px;margin:0 auto;padding:24px 14px 40px}
h1{color:#fff;text-align:center;font-size:28px}
.sub{color:#C8D4EE;text-align:center;font-size:14.5px;margin:6px 0 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#fff;border-radius:18px;padding:22px 18px;text-align:center}
.card h2{color:var(--navy);font-size:22px}
.card .rule{height:1px;background:var(--gold);margin:8px 30px 14px}
.qr{width:220px;height:220px;margin:0 auto;border:1.5px solid var(--navy);border-radius:14px;padding:10px;background:#fff}
.qr svg{width:100%;height:100%;display:block}
.url{font-size:13px;color:var(--goldt);margin-top:10px;word-break:break-all}
.btns{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
button,a.b{border:0;border-radius:999px;padding:0 16px;min-height:44px;font-family:'Jua',sans-serif;font-size:16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.p{background:var(--navy);color:#fff}.s{background:var(--soft);color:var(--navy)}
.note{background:rgba(255,255,255,.08);color:#C8D4EE;border-radius:14px;padding:14px 16px;margin-top:16px;font-size:14px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="j">중등관 QR 코드</h1>
  <p class="sub">이 사이트 주소로 자동으로 만들어집니다. 사이트 이름이 바뀌어도 이 화면은 항상 맞는 QR을 보여 줍니다.</p>
  <div class="grid">
    <div class="card"><h2 class="j">상담 신청 QR</h2><div class="rule"></div>
      <div class="qr" id="q1" role="img" aria-label="상담 신청 QR 코드"></div><div class="url" id="u1"></div>
      <div class="btns"><button class="p" data-k="1" data-f="png">PNG 받기</button><button class="s" data-k="1" data-f="svg">인쇄용 SVG</button></div></div>
    <div class="card"><h2 class="j">온라인 리플렛 QR</h2><div class="rule"></div>
      <div class="qr" id="q2" role="img" aria-label="온라인 리플렛 QR 코드"></div><div class="url" id="u2"></div>
      <div class="btns"><button class="p" data-k="2" data-f="png">PNG 받기</button><button class="s" data-k="2" data-f="svg">인쇄용 SVG</button></div></div>
  </div>
  <div class="note">· 종이 리플렛 · 현수막 · 전단에는 <b>인쇄용 SVG</b>를, 카톡 · 문자에는 <b>PNG</b>를 쓰세요.<br>· 상담 신청 QR로 들어온 신청은 관리자 화면에서 경로가 '리플렛 · QR'로 표시됩니다.</div>
</div>
<script>
const NAVY='#0B2A6F',O=location.origin;
const T={1:{url:O+'/?from=qr',name:'중등관_상담신청_QR'},2:{url:O+'/leaflet',name:'중등관_온라인리플렛_QR'}};
function matrix(url){const q=qrcode(0,'M');q.addData(url);q.make();const n=q.getModuleCount();return {n,dark:(r,c)=>q.isDark(r,c)};}
function svg(url,margin=4){const {n,dark}=matrix(url);let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(dark(r,c))d+=`M${c} ${r}h1v1h-1z`;
  const s=n+margin*2;return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-margin} ${-margin} ${s} ${s}" shape-rendering="crispEdges"><rect x="${-margin}" y="${-margin}" width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="${NAVY}"/></svg>`;}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();}
for(const k of [1,2]){document.getElementById('q'+k).innerHTML=svg(T[k].url,0);document.getElementById('u'+k).textContent=T[k].url;}
document.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{
  const t=T[b.dataset.k],s=svg(t.url);
  if(b.dataset.f==='svg')return dl(new Blob([s],{type:'image/svg+xml'}),t.name+'.svg');
  const img=new Image(),cv=document.createElement('canvas');cv.width=cv.height=1200;
  img.onload=()=>{const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1200,1200);x.imageSmoothingEnabled=false;x.drawImage(img,0,0,1200,1200);cv.toBlob(bl=>dl(bl,t.name+'.png'),'image/png');};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
});
</script>
</body>
</html>
